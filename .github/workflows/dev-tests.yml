name: Dev tests

on:
  push:
    branches: [dev]

jobs:
  cpp-tests:
    name: C++ tests (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            gcc \
            g++

      - name: Configure
        run: cmake --preset linux-gcc-dev -DSIRIUS_ENABLE_PYTHON_BINDINGS=OFF

      - name: Build
        run: cmake --build --preset linux-gcc-dev

      - name: Test
        run: ctest --preset linux-gcc-dev

  python-tests:
    name: Python binding tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            gcc \
            g++

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python build/test deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy tifffile imagecodecs

      - name: Build & install sirius (editable)
        run: pip install -e . --verbose

      - name: Run python tests
        run: python -m unittest discover -s bindings/tests -v

  cuda-build:
    # Hosted runners have no GPU: this compiles the CUDA paths (cuFFT, nvTIFF,
    # kernels) inside the same image the containers/ directory uses and runs
    # the test binary, whose GPU cases SKIP without a device.
    name: CUDA build (compile only, tests skip GPU cases)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.1.0-devel-ubuntu24.04
    steps:
      # actions/checkout shells out to git and git-lfs, and the CUDA image
      # ships neither, so this has to run before the checkout step (the
      # toolchain script below cannot: it lives in the repository).
      - name: Install git for actions/checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git git-lfs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Provision toolchain (same script as the containers)
        run: bash containers/install-deps.sh

      - name: Configure
        run: cmake --preset linux-cuda-dev -DSIRIUS_ENABLE_PYTHON_BINDINGS=OFF -DCMAKE_CUDA_ARCHITECTURES=89

      - name: Build
        run: cmake --build --preset linux-cuda-dev

      - name: Test (CPU paths; CUDA cases skip)
        run: ctest --preset linux-cuda-dev
